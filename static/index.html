<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lingyun Command Center</title>
<style>
/* ── Reset & Base ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; width: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #030712; color: #f9fafb; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; outline: none; }
input, textarea, select { font-family: inherit; outline: none; }

/* ── Animations ────────────────────────────────────────────────── */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 8px rgba(59,130,246,0.4); } 50% { box-shadow: 0 0 20px rgba(59,130,246,0.7); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

.fade-in { animation: fadeIn 0.5s ease-out; }
.slide-up { animation: slideUp 0.6s ease-out both; }
.pulse { animation: pulse 2s infinite; }

/* ── Scrollbar ─────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

/* ── Glass Effect Base ─────────────────────────────────────────── */
.glass {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
}
.glass-sm { border-radius: 12px; }
.glass-xs { border-radius: 8px; }

/* ── Navbar ────────────────────────────────────────────────────── */
.navbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 64px;
  background: rgba(3,7,18,0.85);
  backdrop-filter: blur(24px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.navbar-left { display: flex; align-items: center; gap: 14px; }
.logo-box {
  width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #3b82f6, #8b5cf6);
  font-size: 20px; font-weight: 800; color: #fff;
}
.navbar-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  padding: 8px 20px; border-radius: 8px;
  font-size: 13px; font-weight: 500; color: #9ca3af;
  background: transparent; transition: all 0.2s;
}
.nav-tab:hover { color: #f9fafb; background: rgba(255,255,255,0.06); }
.nav-tab.active { color: #f9fafb; background: rgba(59,130,246,0.15); }
.live-dot {
  display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b7280;
}
.live-dot::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #10b981; box-shadow: 0 0 8px #10b981;
  animation: pulse 2s infinite;
}

/* ── Page Container ────────────────────────────────────────────── */
.page { padding: 28px 32px 120px; max-width: 1440px; margin: 0 auto; animation: fadeIn 0.4s ease-out; }
.page-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
.page-subtitle { font-size: 14px; color: #6b7280; margin-bottom: 28px; }

/* ── Hero Cards ────────────────────────────────────────────────── */
.hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
.hero-card {
  padding: 24px; border-radius: 16px; position: relative; overflow: hidden;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  transition: transform 0.25s, box-shadow 0.25s;
}
.hero-card:hover { transform: translateY(-4px); }
.hero-card.blue { box-shadow: 0 0 30px rgba(59,130,246,0.12), inset 0 1px 0 rgba(59,130,246,0.2); }
.hero-card.green { box-shadow: 0 0 30px rgba(16,185,129,0.12), inset 0 1px 0 rgba(16,185,129,0.2); }
.hero-card.amber { box-shadow: 0 0 30px rgba(245,158,11,0.12), inset 0 1px 0 rgba(245,158,11,0.2); }
.hero-card.red { box-shadow: 0 0 30px rgba(239,68,68,0.12), inset 0 1px 0 rgba(239,68,68,0.2); }
.hero-label { font-size: 12px; font-weight: 500; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.hero-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
.hero-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }

/* ── Section Grid ──────────────────────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
.section-card {
  padding: 24px; border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  animation: slideUp 0.6s ease-out both;
}
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title .icon { font-size: 18px; }

/* ── Tables ────────────────────────────────────────────────────── */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left; padding: 10px 12px; font-weight: 600; color: #9ca3af;
  border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.data-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.data-table tr:hover td { background: rgba(255,255,255,0.03); }

/* ── Performance Bar ───────────────────────────────────────────── */
.perf-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; }
.perf-bar { height: 100%; border-radius: 3px; transition: width 1s ease-out; }

/* ── Badges ────────────────────────────────────────────────────── */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
}
.badge-critical { background: #7f1d1d; color: #fca5a5; }
.badge-high { background: #78350f; color: #fbbf24; }
.badge-medium { background: #1e3a5f; color: #93c5fd; }
.badge-low { background: #14532d; color: #86efac; }
.badge-status-open { background: rgba(59,130,246,0.15); color: #93c5fd; }
.badge-status-pending { background: rgba(245,158,11,0.15); color: #fbbf24; }
.badge-status-working { background: rgba(139,92,246,0.15); color: #c4b5fd; }
.badge-status-in_progress { background: rgba(139,92,246,0.15); color: #c4b5fd; }
.badge-status-completed { background: rgba(16,185,129,0.15); color: #6ee7b7; }
.badge-status-escalated { background: rgba(239,68,68,0.15); color: #fca5a5; }

/* ── Category Badge (sentiment) ────────────────────────────────── */
.cat-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  margin: 4px;
}
.cat-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ── Decision Panel ────────────────────────────────────────────── */
.split-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.action-row {
  padding: 14px 16px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent; transition: all 0.2s;
}
.action-row:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }
.action-row.selected { background: rgba(59,130,246,0.08); border-color: rgba(59,130,246,0.3); }
.action-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.action-desc { font-size: 12px; color: #9ca3af; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.action-meta { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
.decision-panel { padding: 24px; }
.ai-rec {
  padding: 16px; border-radius: 12px;
  background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2);
  font-size: 13px; line-height: 1.7; white-space: pre-wrap; max-height: 300px; overflow-y: auto;
}
.ai-rec-label { font-size: 11px; font-weight: 600; color: #a78bfa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.btn-group { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn {
  padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
.btn-success { background: #10b981; color: #fff; }
.btn-success:hover { background: #059669; transform: translateY(-1px); }
.btn-danger { background: #ef4444; color: #fff; }
.btn-danger:hover { background: #dc2626; transform: translateY(-1px); }
.btn-ghost { background: rgba(255,255,255,0.06); color: #d1d5db; border: 1px solid rgba(255,255,255,0.1); }
.btn-ghost:hover { background: rgba(255,255,255,0.1); }
.textarea-dark {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  color: #f9fafb; font-size: 13px; resize: vertical; min-height: 80px;
  margin-top: 12px; transition: border-color 0.2s;
}
.textarea-dark:focus { border-color: rgba(59,130,246,0.5); }
.textarea-dark::placeholder { color: #6b7280; }

/* ── Consumer Portal ───────────────────────────────────────────── */
.tab-bar { display: flex; gap: 4px; margin-bottom: 24px; padding: 4px; background: rgba(255,255,255,0.04); border-radius: 12px; width: fit-content; }
.tab-btn {
  padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: #9ca3af; background: transparent; transition: all 0.2s;
}
.tab-btn.active { background: rgba(59,130,246,0.15); color: #f9fafb; }
.tab-btn:hover:not(.active) { color: #d1d5db; }

.product-card {
  padding: 28px; border-radius: 16px; text-align: center;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  transition: transform 0.3s, box-shadow 0.3s;
}
.product-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.product-icon { font-size: 64px; margin-bottom: 16px; }
.product-name { font-size: 20px; font-weight: 800; }
.product-tagline { font-size: 13px; color: #6b7280; margin: 4px 0 12px; }
.product-price { font-size: 28px; font-weight: 800; color: #3b82f6; margin-bottom: 16px; }
.product-features { list-style: none; text-align: left; margin-bottom: 20px; }
.product-features li { font-size: 13px; color: #d1d5db; padding: 4px 0; display: flex; align-items: center; gap: 8px; }
.product-features li::before { content: "\2713"; color: #10b981; font-weight: 700; }
.product-rating { color: #fbbf24; font-size: 14px; margin-bottom: 16px; }
.product-select { width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #f9fafb; font-size: 13px; margin-bottom: 12px; }
.product-select option { background: #1f2937; }

/* ── Forms ──────────────────────────────────────────────────────── */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 600; color: #9ca3af; margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
.form-input {
  width: 100%; padding: 10px 14px; border-radius: 8px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  color: #f9fafb; font-size: 13px; transition: border-color 0.2s;
}
.form-input:focus { border-color: rgba(59,130,246,0.5); }
.form-input::placeholder { color: #4b5563; }

/* ── Chat ──────────────────────────────────────────────────────── */
.chat-container {
  display: flex; flex-direction: column; height: 500px; border-radius: 16px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); overflow: hidden;
}
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.chat-bubble {
  max-width: 75%; padding: 12px 16px; border-radius: 14px; font-size: 13px; line-height: 1.6;
  animation: slideUp 0.3s ease-out;
}
.chat-bubble.user { background: #3b82f6; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.chat-bubble.ai { background: rgba(255,255,255,0.08); color: #f9fafb; align-self: flex-start; border-bottom-left-radius: 4px; }
.chat-input-row { display: flex; gap: 8px; padding: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
.chat-input {
  flex: 1; padding: 12px 16px; border-radius: 12px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  color: #f9fafb; font-size: 13px;
}
.chat-input:focus { border-color: rgba(59,130,246,0.5); }
.chat-input::placeholder { color: #6b7280; }

/* ── Genie Floating Button ─────────────────────────────────────── */
.genie-fab {
  position: fixed; bottom: 28px; right: 28px; z-index: 200;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #8b5cf6, #3b82f6);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(139,92,246,0.4);
  transition: transform 0.3s, box-shadow 0.3s;
  font-size: 24px; color: #fff;
}
.genie-fab:hover { transform: scale(1.1); box-shadow: 0 12px 40px rgba(139,92,246,0.6); }

.genie-panel {
  position: fixed; bottom: 96px; right: 28px; z-index: 200;
  width: 400px; max-height: 520px; border-radius: 20px;
  background: rgba(15,23,42,0.95); backdrop-filter: blur(24px);
  border: 1px solid rgba(139,92,246,0.3);
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; overflow: hidden;
  animation: slideUp 0.3s ease-out;
}
.genie-header {
  padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; gap: 10px;
}
.genie-header-icon {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, #8b5cf6, #3b82f6);
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.genie-header-text h3 { font-size: 14px; font-weight: 700; }
.genie-header-text p { font-size: 11px; color: #6b7280; }
.genie-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
.genie-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08); }
.genie-input-row { display: flex; gap: 8px; }
.genie-sql { margin-top: 8px; font-size: 11px; color: #9ca3af; }
.genie-sql summary { cursor: pointer; font-weight: 600; color: #a78bfa; }
.genie-sql pre {
  margin-top: 6px; padding: 10px; border-radius: 8px;
  background: rgba(0,0,0,0.3); font-size: 11px; overflow-x: auto; white-space: pre-wrap;
  color: #d1d5db; font-family: 'SF Mono', 'Fira Code', monospace;
}

/* ── Loading ───────────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.1);
  border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.6s linear infinite;
  display: inline-block;
}
.spinner-sm { width: 16px; height: 16px; }
.loading-center { display: flex; align-items: center; justify-content: center; padding: 40px; }

/* ── Order Modal ───────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease-out;
}
.modal-content {
  width: 420px; max-width: 90vw; padding: 28px; border-radius: 20px;
  background: rgba(15,23,42,0.97); backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  animation: slideUp 0.3s ease-out;
}
.modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }

/* ── Success Toast ─────────────────────────────────────────────── */
.toast {
  position: fixed; top: 80px; right: 32px; z-index: 400;
  padding: 14px 24px; border-radius: 12px;
  background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3);
  color: #6ee7b7; font-size: 13px; font-weight: 600;
  animation: slideUp 0.3s ease-out;
  display: flex; align-items: center; gap: 8px;
}

/* ── CSS Bar Chart ─────────────────────────────────────────────── */
.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-label { font-size: 12px; color: #d1d5db; width: 110px; flex-shrink: 0; text-align: right; }
.bar-track { flex: 1; height: 28px; background: rgba(255,255,255,0.04); border-radius: 6px; overflow: hidden; position: relative; }
.bar-fill { height: 100%; border-radius: 6px; transition: width 1s ease-out; display: flex; align-items: center; padding-left: 10px; font-size: 11px; font-weight: 600; color: #fff; min-width: fit-content; }
.bar-value { font-size: 12px; color: #9ca3af; width: 60px; text-align: right; flex-shrink: 0; }

/* ── SVG Radar ─────────────────────────────────────────────────── */
.radar-container { display: flex; flex-direction: column; align-items: center; }
.radar-legend { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
.radar-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #d1d5db; }
.radar-legend-dot { width: 10px; height: 10px; border-radius: 2px; }

/* ── Sentiment Mini Chart ──────────────────────────────────────── */
.trend-chart { display: flex; align-items: flex-end; gap: 3px; height: 80px; padding-top: 10px; }
.trend-bar { flex: 1; border-radius: 3px 3px 0 0; transition: height 0.5s ease-out; min-width: 4px; }
.trend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #6b7280; margin-top: 4px; }

/* ── Responsive ────────────────────────────────────────────────── */
@media (max-width: 1024px) {
  .hero-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .split-layout { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  .genie-panel { width: calc(100vw - 32px); right: 16px; }
}
@media (max-width: 640px) {
  .hero-grid { grid-template-columns: 1fr; }
  .navbar { padding: 0 16px; }
  .page { padding: 20px 16px 120px; }
  .nav-tabs { display: none; }
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   Lingyun Command Center - Vanilla JS Frontend (No React, No CDN)
   ══════════════════════════════════════════════════════════════════ */

// ── Helpers ──────────────────────────────────────────────────────
function fmt(n, prefix) {
  prefix = prefix || '';
  if (n == null || isNaN(Number(n))) return '--';
  var num = Number(n);
  if (num >= 1e6) return prefix + (num / 1e6).toFixed(2) + 'M';
  if (num >= 1e3) return prefix + (num / 1e3).toFixed(1) + 'K';
  return prefix + num.toFixed(num % 1 === 0 ? 0 : 2);
}

function esc(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function api(path, opts) {
  try {
    var res = await fetch(path, opts);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    console.error('API ' + path + ':', e);
    return null;
  }
}

function showToast(msg) {
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '\u2713 ' + esc(msg);
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3500);
}

function spinnerHTML() {
  return '<div class="loading-center"><div class="spinner"></div></div>';
}

// ── Hash Router ──────────────────────────────────────────────────
var currentRoute = '';

function getRoute() {
  var h = window.location.hash || '#/';
  if (h === '#' || h === '#/') return '/';
  return h.substring(1);
}

function navigate(path) {
  window.location.hash = '#' + path;
}

// ── Navbar ───────────────────────────────────────────────────────
function renderNavbar() {
  var route = getRoute();
  var navItems = [
    { path: '/', altPath: '/insights', label: 'Executive Insights' },
    { path: '/staff', label: 'Staff AI Hub' },
    { path: '/consumer', label: 'Consumer Portal' }
  ];
  var tabsHTML = navItems.map(function(item) {
    var isActive = route === item.path || (item.altPath && route === item.altPath);

// ── Routing + Render ─────────────────────────────────────────────
function render() {
  var route = getRoute();
  if (route === currentRoute) return;
  currentRoute = route;

  var root = document.getElementById('root');
  root.innerHTML = renderNavbar() + '<div id="page-content"></div>';

  // Attach nav click handlers
  root.querySelectorAll('.nav-tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      navigate(this.getAttribute('data-nav'));
    });
  });

  var page = document.getElementById('page-content');

  if (route === '/' || route === '/insights') {
    renderInsightsPage(page);
  } else if (route === '/staff') {
    renderStaffPage(page);
  } else if (route === '/consumer') {
    renderConsumerPage(page);
  } else {
    page.innerHTML = '<div class="page"><h1 class="page-title">404</h1><p class="page-subtitle">Page not found</p></div>';
  }

  renderGenie();
}

window.addEventListener('hashchange', function() { currentRoute = ''; render(); });
window.addEventListener('DOMContentLoaded', render);

// ── SVG Radar Chart Builder ──────────────────────────────────────
function buildRadarChart(modelComp) {
  if (!modelComp || modelComp.length === 0) {
    return '<div style="color:#6b7280;text-align:center;padding:40px">No model data available</div>';
  }

  var axes = ['Price Value', 'Sales Volume', 'Satisfaction', 'Quality'];
  var numAxes = axes.length;
  var cx = 150, cy = 150, maxR = 110;
  var radarColors = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b'];

  // Normalize data
  var maxSales = Math.max.apply(null, modelComp.map(function(m) { return Number(m.sales_volume) || 1; }));
  var models = modelComp.map(function(m) {
    return {
      name: (m.phone_model || '').replace('Lingyun ', ''),
      values: [
        Math.min(100, (Number(m.avg_price) || 0) / 16),
        Math.min(100, (Number(m.sales_volume) || 0) / maxSales * 100),
        (Number(m.avg_csat) || 0) * 20,
        Number(m.quality_score) || 0
      ]
    };
  });

  // Build SVG
  var svg = '<svg viewBox="0 0 300 300" style="width:100%;max-width:320px;margin:0 auto;display:block">';

  // Draw grid rings
  [0.25, 0.5, 0.75, 1.0].forEach(function(scale) {
    var points = [];
    for (var i = 0; i < numAxes; i++) {
      var angle = (Math.PI * 2 * i / numAxes) - Math.PI / 2;
      points.push((cx + maxR * scale * Math.cos(angle)).toFixed(1) + ',' + (cy + maxR * scale * Math.sin(angle)).toFixed(1));
    }
    svg += '<polygon points="' + points.join(' ') + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
  });

  // Draw axis lines and labels
  for (var i = 0; i < numAxes; i++) {
    var angle = (Math.PI * 2 * i / numAxes) - Math.PI / 2;
    var x2 = cx + maxR * Math.cos(angle);
    var y2 = cy + maxR * Math.sin(angle);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';
    var lx = cx + (maxR + 18) * Math.cos(angle);
    var ly = cy + (maxR + 18) * Math.sin(angle);
    var anchor = 'middle';
    if (Math.cos(angle) > 0.3) anchor = 'start';
    if (Math.cos(angle) < -0.3) anchor = 'end';
    svg += '<text x="' + lx.toFixed(1) + '" y="' + (ly + 4).toFixed(1) + '" text-anchor="' + anchor + '" fill="#d1d5db" font-size="10">' + axes[i] + '</text>';
  }

  // Draw each model's polygon
  models.forEach(function(model, mi) {
    var pts = [];
    for (var i = 0; i < numAxes; i++) {
      var angle = (Math.PI * 2 * i / numAxes) - Math.PI / 2;
      var r = maxR * (model.values[i] / 100);
      pts.push((cx + r * Math.cos(angle)).toFixed(1) + ',' + (cy + r * Math.sin(angle)).toFixed(1));
    }
    var color = radarColors[mi % radarColors.length];
    svg += '<polygon points="' + pts.join(' ') + '" fill="' + color + '" fill-opacity="0.12" stroke="' + color + '" stroke-width="2"/>';
    // Draw dots at vertices
    for (var i = 0; i < numAxes; i++) {
      var angle = (Math.PI * 2 * i / numAxes) - Math.PI / 2;
      var r = maxR * (model.values[i] / 100);
      svg += '<circle cx="' + (cx + r * Math.cos(angle)).toFixed(1) + '" cy="' + (cy + r * Math.sin(angle)).toFixed(1) + '" r="3" fill="' + color + '"/>';
    }
  });

  svg += '</svg>';

  // Legend
  var legend = '<div class="radar-legend">';
  models.forEach(function(model, mi) {
    legend += '<div class="radar-legend-item"><div class="radar-legend-dot" style="background:' + radarColors[mi % radarColors.length] + '"></div>' + esc(model.name) + '</div>';
  });
  legend += '</div>';

  return '<div class="radar-container">' + svg + legend + '</div>';
}

async function selectStaffAction(actionId, container) {
  var item = staffState.actions.find(function(a) { return String(a.action_id) === String(actionId); });

  staffState.selectedId = item.action_id;
  staffState.context = null;
  staffState.notes = '';
  renderStaffContent(container);

  var ctx = await api('/api/actions/' + item.action_id + '/context');
  staffState.context = ctx || false;
  renderStaffContent(container);
}

async function updateStaffAction(status, container) {
  if (!staffState.selectedId) return;
  await api('/api/actions/' + staffState.selectedId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action_id: staffState.selectedId, status: status, resolution_notes: staffState.notes || null })
  });
  showToast('Action ' + status.toLowerCase().replace('_', ' ') + ' successfully');
  staffState.selectedId = null;
  staffState.context = null;
  staffState.notes = '';

  var data = await api('/api/actions');
  staffState.actions = data || [];
  renderStaffContent(container);
}

      '<div class="product-tagline">' + esc(p.tagline) + '</div>' +
      '<div class="product-rating">' + stars + ' ' + p.rating + '</div>' +
      '<div class="product-price">$' + p.price + '</div>' +
      '<ul class="product-features">' + features + '</ul>' +
      '<button class="btn btn-primary" style="width:100%;justify-content:center" data-buy="' + i + '">Buy Now</button>' +
    '</div>';
  }).join('');

  container.innerHTML = '<div class="grid-3">' + cards + '</div>';

  container.querySelectorAll('[data-buy]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var idx = parseInt(this.getAttribute('data-buy'));
      showOrderModal(products[idx]);
    });
  });
}

function showOrderModal(product) {
  // Remove existing modal
  var existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();

  var variantOpts = product.variants.map(function(v) {
    return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
  }).join('');

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-content">' +
    '<div class="modal-title">Order ' + esc(product.name) + '</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Full Name</label>' +
      '<input class="form-input" id="order-name" placeholder="Enter your name">' +
    '</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Email</label>' +
      '<input class="form-input" id="order-email" type="email" placeholder="you@example.com">' +
    '</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Variant</label>' +
      '<select class="product-select" id="order-variant">' + variantOpts + '</select>' +
    '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px">' +
      '<span style="font-size:22px;font-weight:800;color:#3b82f6">$' + product.price + '</span>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-ghost" id="order-cancel">Cancel</button>' +
        '<button class="btn btn-primary" id="order-submit">Place Order</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });

  document.getElementById('order-cancel').addEventListener('click', function() { overlay.remove(); });

  document.getElementById('order-submit').addEventListener('click', async function() {
    var name = document.getElementById('order-name').value;
    var email = document.getElementById('order-email').value;
    var variant = document.getElementById('order-variant').value;
    if (!name || !email || !variant) return;

    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner spinner-sm"></span>';

    var res = await api('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        customer_name: name,
        customer_email: email,
        phone_model: product.name,
        variant: variant,
        quantity: 1,
        payment_method: 'Credit Card',
        channel: 'Online',
        region: 'Asia-Pacific'
      })
    });

    overlay.remove();
    if (res) showToast('Order ' + res.order_id + ' placed! Total: $' + res.total);
  });
}

// ── Service Center ───────────────────────────────────────────────
function renderServiceCenter(container) {
  var issueCategories = ['Hardware Malfunction', 'Software Bug', 'Battery Issue', 'Screen Damage', 'Network Problem', 'Camera Issue', 'Delivery Problem', 'Other'];
  var catOptions = issueCategories.map(function(c) { return '<option>' + esc(c) + '</option>'; }).join('');

  container.innerHTML = '<div style="max-width:600px">' +
    '<div class="section-card">' +
      '<div class="section-title"><span class="icon">\uD83C\uDD98</span> Submit Support Ticket</div>' +
      '<div class="grid-2" style="margin-bottom:0;gap:16px">' +
        '<div class="form-group"><label class="form-label">Order ID</label><input class="form-input" id="svc-order-id" placeholder="ORD-XXXXXXXX"></div>' +
        '<div class="form-group"><label class="form-label">Your Name</label><input class="form-input" id="svc-name" placeholder="Full name"></div>' +
      '</div>' +
      '<div class="grid-2" style="margin-bottom:0;gap:16px">' +
        '<div class="form-group"><label class="form-label">Phone Model</label>' +
          '<select class="product-select" id="svc-model" style="margin-bottom:0"><option>Lingyun X1</option><option>Lingyun Pro</option><option>Lingyun Ultra</option></select></div>' +
        '<div class="form-group"><label class="form-label">Issue Category</label>' +
          '<select class="product-select" id="svc-category" style="margin-bottom:0">' + catOptions + '</select></div>' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">Priority</label>' +
        '<div style="display:flex;gap:8px" id="svc-priority-group">' +
          '<button class="badge badge-low" data-priority="LOW" style="cursor:pointer;opacity:0.4">LOW</button>' +
          '<button class="badge badge-medium" data-priority="MEDIUM" style="cursor:pointer;opacity:1">MEDIUM</button>' +
          '<button class="badge badge-high" data-priority="HIGH" style="cursor:pointer;opacity:0.4">HIGH</button>' +
          '<button class="badge badge-critical" data-priority="CRITICAL" style="cursor:pointer;opacity:0.4">CRITICAL</button>' +
        '</div>' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">Issue Description</label>' +
        '<textarea class="textarea-dark" id="svc-desc" placeholder="Describe your issue in detail..." style="margin-top:0"></textarea>' +
      '</div>' +
      '<button class="btn btn-primary" id="svc-submit" style="margin-top:8px">Submit Ticket</button>' +
    '</div>' +
  '</div>';

  var currentPriority = 'MEDIUM';

  document.getElementById('svc-priority-group').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-priority]');
    if (!btn) return;
    currentPriority = btn.getAttribute('data-priority');
    this.querySelectorAll('[data-priority]').forEach(function(b) {
      b.style.opacity = b.getAttribute('data-priority') === currentPriority ? '1' : '0.4';
    });
  });

  document.getElementById('svc-submit').addEventListener('click', async function() {
    var orderId = document.getElementById('svc-order-id').value;
    var name = document.getElementById('svc-name').value;
    var desc = document.getElementById('svc-desc').value;
    if (!orderId || !name || !desc) return;

    var btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner spinner-sm"></span>';

    var res = await api('/api/tickets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        order_id: orderId,
        customer_name: name,
        phone_model: document.getElementById('svc-model').value,
        issue_category: document.getElementById('svc-category').value,
        issue_description: desc,
        priority: currentPriority
      })
    });

    btn.disabled = false;
    btn.textContent = 'Submit Ticket';
    if (res) {
      showToast('Ticket ' + res.ticket_id + ' created!');
      document.getElementById('svc-order-id').value = '';
      document.getElementById('svc-name').value = '';
      document.getElementById('svc-desc').value = '';
    }
  });
}

// ── AI Concierge ─────────────────────────────────────────────────
var conciergeMessages = [
  { role: 'ai', text: 'Welcome to Lingyun AI Concierge! I can help you with order tracking, product recommendations, technical support, and more. How can I assist you today?' }
];

function renderConcierge(container) {
  var msgsHTML = conciergeMessages.map(function(m) {
    return '<div class="chat-bubble ' + m.role + '">' + esc(m.text) + '</div>';
  }).join('');

  container.innerHTML = '<div class="chat-container">' +
    '<div class="chat-messages" id="concierge-messages">' + msgsHTML + '</div>' +
    '<div class="chat-input-row">' +
      '<input class="chat-input" id="concierge-input" placeholder="Ask me anything about Lingyun phones...">' +
      '<button class="btn btn-primary" id="concierge-send">Send</button>' +
    '</div>' +
  '</div>';

  var msgsContainer = document.getElementById('concierge-messages');
  msgsContainer.scrollTop = msgsContainer.scrollHeight;

  var sendFn = async function() {
    var input = document.getElementById('concierge-input');
    var msg = input.value.trim();
    if (!msg) return;
    input.value = '';

    conciergeMessages.push({ role: 'user', text: msg });

    // Add user bubble + typing indicator
    var userBubble = document.createElement('div');
    userBubble.className = 'chat-bubble user';
    userBubble.textContent = msg;
    msgsContainer.appendChild(userBubble);

    var typing = document.createElement('div');
    typing.className = 'chat-bubble ai';
    typing.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span> Thinking...';
    msgsContainer.appendChild(typing);
    msgsContainer.scrollTop = msgsContainer.scrollHeight;

    var res = await api('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });

    var reply = (res && res.response) || 'Sorry, I encountered an error. Please try again.';
    conciergeMessages.push({ role: 'ai', text: reply });

    typing.innerHTML = esc(reply);
    msgsContainer.scrollTop = msgsContainer.scrollHeight;
  };

  document.getElementById('concierge-send').addEventListener('click', sendFn);
  document.getElementById('concierge-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendFn();
  });
}

// ═══════════════════════════════════════════════════════════════════
// GENIE FLOATING ASSISTANT
// ═══════════════════════════════════════════════════════════════════
var genieOpen = false;
var genieMessages = [];

function renderGenie() {
  // Remove existing
  var existingFab = document.getElementById('genie-fab');
  var existingPanel = document.getElementById('genie-panel-el');
  if (existingFab) existingFab.remove();
  if (existingPanel) existingPanel.remove();

  // Floating button
  var fab = document.createElement('button');
  fab.className = 'genie-fab';
  fab.id = 'genie-fab';
  fab.textContent = genieOpen ? '\u2715' : '\u2728';
  fab.addEventListener('click', function() {
    genieOpen = !genieOpen;
    renderGenie();
  });
  document.body.appendChild(fab);

  if (!genieOpen) return;

  var panel = document.createElement('div');
  panel.className = 'genie-panel';
  panel.id = 'genie-panel-el';

  var msgsHTML = '';
  if (genieMessages.length === 0) {
    msgsHTML = '<div style="text-align:center;color:#6b7280;padding:20px;font-size:13px">' +
      '<div style="font-size:32px;margin-bottom:8px">\u2728</div>' +
      'Try: "What is our total revenue by region?" or "Which phone model has the most complaints?"' +
    '</div>';
  } else {
    msgsHTML = genieMessages.map(function(m) {
      var html = '<div><div class="chat-bubble ' + m.role + '">' + esc(m.text) + '</div>';
      if (m.sql) {
        html += '<div class="genie-sql"><details><summary>View Generated SQL</summary><pre>' + esc(m.sql) + '</pre></details></div>';
      }
      html += '</div>';
      return html;
    }).join('');
  }

  panel.innerHTML = '<div class="genie-header">' +
    '<div class="genie-header-icon">\u2728</div>' +
    '<div class="genie-header-text"><h3>Data Genie</h3><p>Ask anything about your business data</p></div>' +
    '<button id="genie-close" style="margin-left:auto;background:none;color:#9ca3af;font-size:18px">\u2715</button>' +
  '</div>' +
  '<div class="genie-body" id="genie-body">' + msgsHTML + '</div>' +
  '<div class="genie-footer"><div class="genie-input-row">' +
    '<input class="chat-input" id="genie-input" placeholder="Ask a business question...">' +
    '<button class="btn btn-primary" id="genie-ask">Ask</button>' +
  '</div></div>';

  document.body.appendChild(panel);

  var body = document.getElementById('genie-body');
  body.scrollTop = body.scrollHeight;

  document.getElementById('genie-close').addEventListener('click', function() {
    genieOpen = false;
    renderGenie();
  });

  var askFn = async function() {
    var input = document.getElementById('genie-input');
    var q = input.value.trim();
    if (!q) return;
    input.value = '';

    genieMessages.push({ role: 'user', text: q });
    var userBubble = document.createElement('div');
    userBubble.innerHTML = '<div class="chat-bubble user">' + esc(q) + '</div>';
    body.appendChild(userBubble);

    var typing = document.createElement('div');
    typing.className = 'chat-bubble ai';
    typing.innerHTML = '<span class="spinner" style="width:14px;height:14px"></span> Querying data...';
    body.appendChild(typing);
    body.scrollTop = body.scrollHeight;

    var res = await api('/api/genie/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });

    if (res) {
      var answer = res.answer || 'No answer available.';
      genieMessages.push({ role: 'ai', text: answer, sql: res.sql, results: res.results });
      var replyHTML = '<div class="chat-bubble ai">' + esc(answer) + '</div>';
      if (res.sql) {
        replyHTML += '<div class="genie-sql"><details><summary>View Generated SQL</summary><pre>' + esc(res.sql) + '</pre></details></div>';
      }
      typing.outerHTML = '<div>' + replyHTML + '</div>';
    } else {
      genieMessages.push({ role: 'ai', text: 'Sorry, something went wrong.' });
      typing.innerHTML = esc('Sorry, something went wrong.');
    }
    body.scrollTop = body.scrollHeight;
  };

  document.getElementById('genie-ask').addEventListener('click', askFn);
  document.getElementById('genie-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') askFn();
  });
}
</script>
